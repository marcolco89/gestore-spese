name: Backup giornaliero DB
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Sveglia Render
        run: |
          echo "Warm-up Render..."
          curl --max-time 60 --retry 3 --retry-delay 10 \
            "${{ secrets.RENDER_URL }}/" || true
          sleep 15
          echo "Render pronto"

      - name: Scarica backup dal server
        run: |
          curl --retry 5 --retry-delay 15 --retry-all-errors \
            --max-time 120 --connect-timeout 30 \
            -f "${{ secrets.RENDER_URL }}/api/backup/all?secret=${{ secrets.BACKUP_SECRET }}" \
            -o backup_temp.json
          echo "Backup scaricato con successo"
          cat backup_temp.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('Chiavi nel backup:', len(d.get('keys',[])))"

      - name: Salva backup con data
        run: |
          mkdir -p backups
          DATE=$(date +%Y-%m-%d)
          cp backup_temp.json backups/backup_${DATE}.json
          cp backup_temp.json backups/backup_latest.json
          echo "File salvati: backup_${DATE}.json e backup_latest.json"

      - name: Commit e push del backup
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Backup automatico $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
