name: Backup giornaliero DB
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Sveglia Render e attendi
        run: |
          echo "Warm-up Render..."
          curl --max-time 90 --retry 5 --retry-delay 15 --retry-all-errors \
            "${{ secrets.RENDER_URL }}/" -o /dev/null -w "HTTP status: %{http_code}\n" || true
          echo "Attendo 20 secondi..."
          sleep 20
          echo "Pronto"

      - name: Scarica backup dal server
        run: |
          echo "Scarico il backup..."
          HTTP_CODE=$(curl --retry 5 --retry-delay 20 --retry-all-errors \
            --max-time 120 --connect-timeout 30 \
            -w "%{http_code}" \
            "${{ secrets.RENDER_URL }}/api/backup/all?secret=${{ secrets.BACKUP_SECRET }}" \
            -o backup_temp.json)
          echo "HTTP response: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Errore! Risposta del server:"
            cat backup_temp.json
            exit 1
          fi
          echo "Backup scaricato con successo"
          python3 -c "import json; d=json.load(open('backup_temp.json')); print('Chiavi nel backup:', len(d.get('keys',[])))"

      - name: Salva backup con data
        run: |
          mkdir -p backups
          DATE=$(date +%Y-%m-%d)
          cp backup_temp.json backups/backup_${DATE}.json
          cp backup_temp.json backups/backup_latest.json
          echo "File salvati: backup_${DATE}.json e backup_latest.json"

      - name: Commit e push del backup
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Backup automatico $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
