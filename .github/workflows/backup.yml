name: Backup giornaliero DB
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scarica backup da Supabase
        env:
          SUPABASE_URL: https://kvbnutackqlekkvlgnno.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          HTTP_CODE=$(curl --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 60 -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/storage?select=key,value" \
            -o rows.json)
          echo "HTTP response: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then cat rows.json; exit 1; fi

      - name: Converti nel formato di backup
        run: |
          python3 - <<'EOF'
          import json, datetime
          rows = json.load(open('rows.json'))
          if len(rows) < 10:
              raise SystemExit('Troppe poche chiavi (%d): backup scartato, non sovrascrivo' % len(rows))
          out = {
              'data': {r['key']: r['value'] for r in rows},
              'keys': [r['key'] for r in rows],
              'timestamp': datetime.datetime.utcnow().isoformat(),
          }
          json.dump(out, open('backup_temp.json', 'w'), ensure_ascii=False)
          print('Chiavi nel backup:', len(rows))
          EOF

      - name: Salva backup con data
        run: |
          mkdir -p backups
          DATE=$(date +%Y-%m-%d)
          cp backup_temp.json backups/backup_${DATE}.json
          cp backup_temp.json backups/backup_latest.json

      - name: Commit e push del backup
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Backup automatico $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
