var _storageCache = {};
var SUPABASE_URL = 'https://kvbnutackqlekkvlgnno.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2Ym51dGFja3FsZWtrdmxnbm5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyODI5OTcsImV4cCI6MjEwNjg1ODk5N30.81VqXNc8Xh2xIpLMdiPg-CjU3JI4nTO96M6oM2bTXbI';
var _sbHeaders = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};

function _sbGet(ak) {
  return fetch(SUPABASE_URL + '/rest/v1/storage?key=eq.' + encodeURIComponent(ak) + '&select=value', {
    headers: _sbHeaders
  }).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(rows){ return (rows && rows.length > 0) ? rows[0].value : null; });
}

function _sbSet(ak, value) {
  return fetch(SUPABASE_URL + '/rest/v1/storage', {
    method: 'POST',
    headers: Object.assign({}, _sbHeaders, {'Prefer': 'resolution=merge-duplicates'}),
    body: JSON.stringify({ key: ak, value: value })
  });
}

(function() {
  var fakeLS = {
    getItem: function(key) {
      if (typeof key === 'string' && key.indexOf('gs_') === 0) {
        return (_storageCache[key] !== undefined) ? _storageCache[key] : null;
      }
      return null;
    },
    setItem: function(key, value) {
      if (typeof key === 'string' && key.indexOf('gs_') === 0) {
        var existing = _storageCache[key];
        // Blocca sovrascrittura con array vuoto o oggetto vuoto se la cache ha gia dati reali
        if (existing && (value === '[]' || value === '{}') && existing !== '[]' && existing !== '{}') {
          console.warn('[Storage] Bloccata sovrascrittura con valore vuoto per:', key);
          return;
        }
        _storageCache[key] = value;
        var ak = key.substring(3);
        _sbSet(ak, value).catch(function(e){ console.error('[Storage] Errore:', e); });
      }
    },
    removeItem: function(key) { delete _storageCache[key]; },
    key: function(n) { return null; },
    clear: function() {},
    get length() { return 0; }
  };
  try {
    Object.defineProperty(window, 'localStorage', {
      get: function() { return fakeLS; },
      configurable: true
    });
    console.log('[Storage] Shim attivo - dati su Supabase');
  } catch(e) { console.warn('[Storage] Shim fallito:', e); }
})();

function loadAllWithRetry(keys, attempt, maxAttempts, onDone) {
  fetch(SUPABASE_URL + '/rest/v1/storage?select=key,value', { headers: _sbHeaders })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(rows){
      if (rows && Array.isArray(rows) && rows.length > 0) {
        rows.forEach(function(row){
          _storageCache['gs_' + row.key] = row.value;
        });
        console.log('[Storage] Caricate', rows.length, 'chiavi da Supabase');
        onDone();
      } else if (attempt < maxAttempts) {
        setTimeout(function(){ loadAllWithRetry(keys, attempt+1, maxAttempts, onDone); }, 2000);
      } else {
        onDone();
      }
    })
    .catch(function(e){
      if (attempt < maxAttempts) {
        setTimeout(function(){ loadAllWithRetry(keys, attempt+1, maxAttempts, onDone); }, 2000);
      } else {
        console.error('[Storage] Caricamento fallito dopo ' + maxAttempts + ' tentativi');
        onDone();
      }
    });
}

    // (bp_default, category_labels, theme_override, recurring_expenses, recurring_generated_*, profile_names)
    function onAllDone() {

      ['expenses_marco','expenses_anna','incomes_marco','incomes_anna'].forEach(function(kk) {
        var cached = _storageCache['gs_' + kk];
        if (!cached) return;
        try {
          var arr = JSON.parse(cached);
          var modified = false;
          arr = arr.map(function(item) {
            if (!item.createdAt && item.date) {
              item.createdAt = item.date + 'T00:00:00.000Z';
              modified = true;
            }
            return item;
          });
          if (modified) {
            var newVal = JSON.stringify(arr);
            _storageCache['gs_' + kk] = newVal;
            _sbSet(kk, newVal).catch(function(e){ console.warn('[createdAt] Errore:', e); });
          }
        } catch(e) {}
      });
      runApp();
    }
    loadAllWithRetry([], 0, 5, onAllDone);
  }
}, 30);
